name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Check (content validation, typecheck, lint, unit tests)
        run: npm run check

      - name: Build
        # No Firebase env is needed: public pages build without it, the client SDK
        # is guarded by firebaseConfigured, and SITE_URL defaults to localhost.
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
